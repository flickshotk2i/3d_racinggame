services:
  frontend:
    build: ../frontend
    ports: ['3000:3000']
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api
    depends_on: [backend]
  backend:
    build: ../backend
    ports: ['4000:4000']
    env_file: ../backend/.env
    depends_on: [db]
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: pulse
    ports: ['5432:5432']
